name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME must match package version v$packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Opcional: só embute o PresentMon se o hash estiver fixado em third-party/presentmon.lock.json e conferir.
      - name: Fetch PresentMon (version and SHA-256 pinned)
        continue-on-error: true
        run: node scripts/fetch-presentmon.cjs

      # Login com Google: segredo GOOGLE_OAUTH_JSON = JSON do cliente ("App para computador") ou só o segredo GOCSPX-…
      # (o ID do cliente, público, fica em config/google-client.json). Ver scripts/write-google-oauth.cjs.
      - name: Write Google OAuth client (optional)
        run: node scripts/write-google-oauth.cjs
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}

      # Opcional: Discord (Application ID) e Xbox (ID do app no Azure). Segredo NEXO_INTEGRATIONS_JSON = {"discordAppId":"…","xboxClientId":"…"}
      - name: Write integrations config (optional)
        shell: pwsh
        run: |
          if ($env:NEXO_INTEGRATIONS_JSON) { Set-Content -LiteralPath config/integrations.json -Value $env:NEXO_INTEGRATIONS_JSON -Encoding utf8 } else { Write-Host 'Sem NEXO_INTEGRATIONS_JSON: Discord e Xbox ficam desativados nesta build.' }
        env:
          NEXO_INTEGRATIONS_JSON: ${{ secrets.NEXO_INTEGRATIONS_JSON }}

      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Notas da release: o texto de docs/releases/<tag>.md vira a descrição da release no GitHub.
      - name: Set release notes
        shell: pwsh
        run: |
          $notes = "docs/releases/$env:GITHUB_REF_NAME.md"
          if (Test-Path $notes) { gh release edit "$env:GITHUB_REF_NAME" --title "Nexo Device Care $env:GITHUB_REF_NAME" --notes-file $notes }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O instalador visual embute o Nexo-Setup gerado acima. Se falhar, a release principal já está publicada.
      - name: Build visual installer
        continue-on-error: true
        shell: pwsh
        run: |
          npm --prefix installer-launcher install
          npm --prefix installer-launcher run dist
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload visual installer to the release
        continue-on-error: true
        shell: pwsh
        run: |
          $file = Get-ChildItem installer-launcher/dist/Nexo-Instalador-*.exe | Select-Object -First 1
          gh release upload "$env:GITHUB_REF_NAME" $file.FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux: AppImage (roda em qualquer distribuição) e .deb (Debian/Ubuntu/Mint/Pop!_OS). Publica na mesma release.
  release-linux:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then echo "Tag $GITHUB_REF_NAME must match v$version"; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Write optional configs (Google, Discord, Xbox)
        run: |
          node scripts/write-google-oauth.cjs
          if [ -n "$NEXO_INTEGRATIONS_JSON" ]; then printf '%s' "$NEXO_INTEGRATIONS_JSON" > config/integrations.json; fi
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          NEXO_INTEGRATIONS_JSON: ${{ secrets.NEXO_INTEGRATIONS_JSON }}

      - name: Build and publish AppImage and .deb
        run: npm run release:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
