name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME must match package version v$packageVersion"
          }

      - name: Install dependencies
        run: npm ci

      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload visual installer
        shell: pwsh
        run: |
          $asset = Get-ChildItem "installer-launcher/dist/Nexo-Instalador-*.exe" | Select-Object -First 1
          if (-not $asset) { throw "Visual installer was not generated." }
          gh release upload "$env:GITHUB_REF_NAME" "$($asset.FullName)" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
