# Publica o servidor do Nexo (Cloudflare Workers + D1) quando algo em server/ muda na main.
# Segredos do repositório que este fluxo usa (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token da Cloudflare com permissão de editar Workers e D1
#   CLOUDFLARE_ACCOUNT_ID  ID da conta da Cloudflare
#   NEXO_ADMIN_EMAILS      e-mail(s) que entram no painel do criador (vírgula separa vários)
# O ID do cliente Google (público) vem de config/google-client.json, o mesmo que as builds usam.
# Os segredos do próprio servidor (SESSION_SECRET e DATA_KEY) são criados aqui na primeira vez e nunca aparecem no log.
# NUNCA apague o DATA_KEY na Cloudflare: sem ele, os dados sincronizados não abrem mais.
name: Publicar servidor
on:
  push:
    branches: [main]
    paths: ['server/**', 'tests/server.test.cjs', '.github/workflows/server.yml', 'config/google-client.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes do servidor
        run: node --test tests/server.test.cjs
      # Colar o token às vezes traz espaço, quebra de linha ou texto junto: fica só o token (e o ID da conta).
      - name: Conferir os segredos
        id: check
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TOKEN="$(printf '%s\n' "$RAW_TOKEN" | tr -d '\r' | grep -Eo 'cfut_[A-Za-z0-9_-]+' | head -n 1 || true)"
          if [ -z "$TOKEN" ]; then TOKEN="$(printf '%s\n' "$RAW_TOKEN" | tr -d '\r' | grep -Eo '[A-Za-z0-9_-]{30,}' | head -n 1 || true)"; fi
          ACCOUNT="$(printf '%s\n' "$RAW_ACCOUNT" | grep -Eo '[0-9a-f]{32}' | head -n 1 || true)"
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "Sem CLOUDFLARE_API_TOKEN ou CLOUDFLARE_ACCOUNT_ID válidos: o servidor não foi publicado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Banco D1 (cria se não existir) e migrações
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        run: |
          set -euo pipefail
          find_db() { $WRANGLER d1 list --json | node -e "let s='';process.stdin.on('data',(d)=>s+=d).on('end',()=>{let list=[];try{list=JSON.parse(s)}catch{console.error('Resposta inesperada do wrangler d1 list:\n'+s.slice(0,800));process.exit(1)}const db=(Array.isArray(list)?list:[]).find((x)=>x.name==='nexo');process.stdout.write(db?(db.uuid||db.id||''):'')})"; }
          ID="$(find_db)"
          if [ -z "$ID" ]; then $WRANGLER d1 create nexo > /dev/null; ID="$(find_db)"; fi
          if [ -z "$ID" ]; then echo "Não consegui criar nem achar o banco D1 'nexo'."; exit 1; fi
          sed -i "s/COLOCADO_PELO_DEPLOY/$ID/" wrangler.toml
          $WRANGLER d1 migrations apply nexo --remote
      - name: Publicar o Worker
        if: steps.check.outputs.ready == 'true'
        id: deploy
        working-directory: server
        env:
          NEXO_ADMIN_EMAILS: ${{ secrets.NEXO_ADMIN_EMAILS }}
        run: |
          set -euo pipefail
          # O ID do cliente é público e fica em config/google-client.json (o mesmo que a build usa); o segredo nem é lido aqui.
          CLIENT_ID="$(node -p "require('../config/google-client.json').clientId" 2>/dev/null | grep -E '^[A-Za-z0-9-]+\.apps\.googleusercontent\.com$' || true)"
          if [ -z "$CLIENT_ID" ]; then echo "::error::config/google-client.json sem o ID do cliente Google: o login (e a sincronização) não funcionaria."; exit 1; fi
          echo "Cliente Google: $CLIENT_ID"
          $WRANGLER deploy --var "GOOGLE_CLIENT_IDS:${CLIENT_ID}" --var "ADMIN_EMAILS:${NEXO_ADMIN_EMAILS:-}" | tee deploy.log
          URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Segredos do servidor (cria os que faltam)
        if: steps.check.outputs.ready == 'true'
        working-directory: server
        # Só cria o que falta, e só se conseguiu LER a lista: um erro aqui nunca pode gerar um DATA_KEY novo por cima do antigo.
        run: |
          set -euo pipefail
          LIST="$($WRANGLER secret list --format json 2>/dev/null)" || { echo "Não consegui listar os segredos do Worker; nada foi criado."; exit 1; }
          NAMES="$(printf '%s' "$LIST" | node -e "let s='';process.stdin.on('data',(d)=>s+=d).on('end',()=>{let l;try{l=JSON.parse(s)}catch{process.exit(2)}if(!Array.isArray(l))process.exit(2);process.stdout.write(l.map((x)=>x.name).join(' '))})")" || { echo "Lista de segredos ilegível; nada foi criado."; exit 1; }
          for NAME in SESSION_SECRET DATA_KEY; do
            if printf ' %s ' "$NAMES" | grep -q " $NAME "; then echo "$NAME já existe."; continue; fi
            openssl rand -base64 48 | tr -d '\n' | $WRANGLER secret put "$NAME" > /dev/null
            echo "$NAME criado."
          done
      - name: Conferir no ar
        if: steps.check.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${{ steps.deploy.outputs.url }}/health"; then echo; echo "Servidor no ar: ${{ steps.deploy.outputs.url }}"; exit 0; fi
            sleep 5
          done
          echo "O servidor não respondeu em ${{ steps.deploy.outputs.url }}/health"; exit 1
