# Temporário: regenera o package-lock.json com as versões novas e confere testes e empacotamento.
name: Regenerate lockfile

on:
  push:
    branches: [deps-update]

permissions:
  contents: write

jobs:
  lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install with new versions
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Package check (no publish)
        run: npx electron-builder --win --dir --publish never
      - name: Show resolved versions
        shell: bash
        run: npm ls electron electron-updater electron-builder minimatch --all | grep -E "electron@|electron-updater@|electron-builder@|minimatch@" | sort | uniq -c
      - name: Audit
        shell: bash
        run: npm audit --omit=optional || true
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Lockfile regenerado (Electron 45.2.3, electron-updater 6.8.11, minimatch 11)"
          git push
